<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
   *{
    background-color: black;
}
    
#gameOfLifeCanvas{
    background-color: white;
    margin: auto;
}

.pause{
    display: block;
    width: 250px;
    height: 250px;
    font-size: 75px;
    color: whitesmoke;
    background-color: green;
    border-radius: 10px;
    transition: all 0.5s;
} .pause:hover{
    background-color: darkgreen;
    box-shadow: 5.5px 5.5px 3px 2px black;
    transition: all 0.5s;
} .pause:active{
    box-shadow: 3px 3px 1.5px 1px black;
    transition: all 0.2s;
}
</style>
<body>
    <canvas id="gameOfLifeCanvas" style="border: 1px solid black " width="1000" height="1000">
    </canvas>
    <button class="pause" onclick="pause()">PAUSE</button>
</body>
<script src="./gameOfLife.js"></script>
</html>
